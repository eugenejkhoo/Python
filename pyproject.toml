[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zdte-bots"
version = "0.1.0"
description = "Rule-based 0DTE options trading bots for QQQ, SPY and IWM with paper trading, backtesting and a live dashboard."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["yfinance>=0.2.40", "requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
zdte = "zdte.cli:main"

[tool.setuptools.packages.find]
include = ["zdte*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
